[package]
name = "hawk-daemon"
version = "0.5.1"
edition = "2021"
authors = ["soryu-ryouji <helloryouji@outlook.com>"]
description = "hawk 素材管理后端"
license = "AGPL-3.0-only"

[dependencies]
iroh = { version = "1.4", features = ["tls-ring"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "catch-panic", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
image = "0.25"
fast_image_resize = { version = "5", features = ["image"] }
mime_guess = "2"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
gethostname = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
argon2 = "0.5"
webp = { version = "0.3", default-features = false }
filetime = "0.2.29"
async-stream = "0.3.6"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }

# thin LTO（不用 fat + codegen-units=1）：fat 下每次改源码都要做一次全程序单线程重链接，
# 实测改一行 main.rs 后重链接 90s（10 核 M4，CI 4 核 runner 更久），是发布构建最大的单项开销；
# thin 并行分片链接只要 40s。代价是产物 13.4MB → 25.3MB，相对 ~250MB 的安装包可忽略。
[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
iroh-relay = { version = "1.4", features = ["server"] }
jsonschema = { version = "0.53.0", default-features = false }
tempfile = "3"
