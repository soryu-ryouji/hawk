[package]
name = "hawk-server"
version = "0.2.1"
edition = "2021"
authors = ["soryu-ryouji <helloryouji@outlook.com>"]
description = "hawk 远程访问服务端（单用户：设备注册/心跳/会话撮合/WSS 控制通道）"
license = "AGPL-3.0-only"

[dependencies]
iroh = { version = "1.4", features = ["tls-ring"] }
iroh-relay = { version = "1.4", features = ["server"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
toml_edit = { version = "0.22", features = ["serde"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11.1"
base64 = "0.23.1"
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tempfile = "3"
# 互操作测试：以真 A 侧（daemon 数据面）验证网页版全链路。仅测试依赖，产物零共享
hawk-daemon = { path = "../hawk-daemon" }
