<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hawk</title>
  <style>
    :root {
      --bg-0: #1e1e1e;
      --fg-0: #e8e8e8;
      --fg-1: #9d9d9d;
      --accent: #4f8cff;
      --border: #3c3c3c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg-0);
      color: var(--fg-0);
      font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    /* 自绘标题栏拖拽区（Windows/Linux 无边框窗口）；macOS 由系统红绿灯占据，控件整体隐藏 */
    #titlebar {
      height: 40px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      -webkit-app-region: drag;
      padding-right: 4px;
    }
    #titlebar .win-controls { display: flex; -webkit-app-region: no-drag; }
    #titlebar button {
      width: 46px;
      height: 32px;
      border: 0;
      background: transparent;
      color: var(--fg-1);
      font-size: 14px;
      cursor: pointer;
    }
    #titlebar button:hover { background: #3c3c3c; color: var(--fg-0); }
    #titlebar button.close:hover { background: #e5534b; color: #fff; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-bottom: 40px; /* 视觉重心略上移，抵消 titlebar */
    }
    main img { width: 96px; height: 96px; }
    #status { font-size: 15px; }
    #detail { color: var(--fg-1); font-variant-numeric: tabular-nums; min-height: 20px; }
    .bar {
      width: 320px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      overflow: hidden;
      position: relative;
    }
    #fill {
      height: 100%;
      width: 0;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.15s ease-out;
    }
    /* 不定态：已知文件数但未知总数（遍历阶段）时横向扫动 */
    #fill.indeterminate { width: 30%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide {
      0% { margin-left: 0; }
      50% { margin-left: 70%; }
      100% { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div id="titlebar">
    <div class="win-controls" id="winControls">
      <button id="minBtn" title="最小化">&#9472;</button>
      <button id="closeBtn" class="close" title="关闭">&#10005;</button>
    </div>
  </div>
  <main>
    <img src="../build/icon.png" alt="hawk" />
    <div id="status">正在启动…</div>
    <div class="bar"><div id="fill"></div></div>
    <div id="detail"></div>
  </main>
  <script>
    const shell = window.hawkShell;
    if (shell && shell.platform === 'darwin') {
      document.getElementById('winControls').style.display = 'none';
    }
    document.getElementById('minBtn').addEventListener('click', () => shell.minimizeWindow());
    document.getElementById('closeBtn').addEventListener('click', () => shell.closeWindow());

    const LABELS = {
      scan: '正在扫描素材库…',
      hash: '正在计算文件哈希…',
      apply: '正在更新索引…',
      done: '即将完成…',
    };
    const statusEl = document.getElementById('status');
    const detailEl = document.getElementById('detail');
    const fillEl = document.getElementById('fill');

    shell.onServerProgress((p) => {
      statusEl.textContent = LABELS[p.phase] || '正在启动…';
      if (p.total > 0) {
        fillEl.classList.remove('indeterminate');
        fillEl.style.width = Math.min(100, Math.round((p.processed / p.total) * 100)) + '%';
        detailEl.textContent = p.processed + ' / ' + p.total;
      } else {
        fillEl.classList.add('indeterminate');
        detailEl.textContent = p.processed > 0 ? '已发现 ' + p.processed + ' 个文件' : '';
      }
    });
  </script>
</body>
</html>
