# electron-builder 配置。npm run pack 会先执行 build:server（scripts/build-server.mjs，cargo build --release）
# 产出当前平台的 hawk-daemon 二进制（Rust）。
appId: com.hawk.app
productName: hawk
# 产物名统一「产品-平台-架构」后缀（与 mac 的 hawk-mac-<arch>.zip 对齐，不带版本号）：
# Windows hawk-windows-x64.zip / Linux hawk-linux-x64.AppImage；mac 为 --dir 产物（.app 目录名取 productName），
# zip 由 CI 打包命名 hawk-mac-<arch>.zip
# 只保留中英 Chromium 语言包（默认携带全部 55 种，约 49MB）
electronLanguages:
  - zh-CN
  - en-US
directories:
  output: dist
files:
  - electron/**/*
  - web/dist/**/*
  # 窗口/托盘图标（512px 源图，运行时按平台重采样）
  - build/icon.png
  # 打包前写入的构建标识（git sha，主进程自动更新比较 nightly 新旧用；见 scripts/stamp-build.mjs）
  - build-info.json
extraResources:
  # 各平台 hawk-daemon 二进制（cargo build --release，见 scripts/build-server.mjs）
  - from: resources/hawk-daemon
    to: hawk-daemon
# LAN web 查看：hawk-daemon 以物理路径托管该目录（asar 归档内不可读取）
asarUnpack:
  - web/dist/**/*
mac:
  category: public.app-category.graphics-design
  # dir：只构建 .app 目录，不做镜像打包（zip 由 CI 负责）
  target: dir
win:
  # 绿色软件：zip 解压即用，免安装。相比 portable（NSIS 单文件）无 32 位启动壳，产物全 64 位，构建也不依赖 GitHub 下载 NSIS 工具链
  target: zip
  artifactName: ${productName}-windows-${arch}.${ext}
  # 平台级 extraResources 与顶层追加合并非覆盖，只写增量：Windows 更新辅助程序
  # （hawk-update/，替代 PowerShell 脚本的安装接力，见 scripts/build-update.mjs）
  extraResources:
    - from: resources/hawk-update
      to: hawk-update
linux:
  target: AppImage
  # AppImage 的 ${arch} 会被映射为 x86_64（AppImage 生态命名），与 win/mac 的 x64 不一致——
  # 写死保持全平台统一为 hawk-linux-x64（当前仅 x64；若将来加 arm64 需改回带架构后缀）
  artifactName: hawk-linux-x64.${ext}
  icon: build/icon.png
  category: Graphics
  # WM_CLASS 与 .desktop 关联（配合 package.json 的 desktopName），否则桌面环境无法把运行中的窗口关联到启动器
  syncDesktopName: true
