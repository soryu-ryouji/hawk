# hawk-server 一键部署：编辑下方密钥后 `docker compose up -d --build` 即完成。
# 域名/TLS 由宿主机 nginx 终结（配置示例见 docs/backend/remote-deployment.md），
# 本服务的明文端口只绑环回，公网入口只经 nginx。
services:
  hawk-server:
    build:
      context: .
      args:
        # 国内拉不动 docker.io 时，用环境变量覆盖为镜像代理（默认官方源）
        NODE_IMAGE: ${NODE_IMAGE:-node:26-slim}
        RUST_IMAGE: ${RUST_IMAGE:-rust:1-slim-bookworm}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:-debian:bookworm-slim}
    image: hawk-server:latest
    container_name: hawk-server
    restart: unless-stopped
    environment:
      # ↓↓↓ 部署前改成你的访问密钥（openssl rand -hex 32 生成），客户端与网页登录都用它
      HAWK_SERVER_ACCESS_KEY: '在此填入访问密钥'
    volumes:
      - hawk-server-data:/data
    ports:
      # 明文端口只绑环回：nginx 同台机反代到 127.0.0.1:27370
      - '127.0.0.1:27370:27370'

volumes:
  hawk-server-data:
