[package]
name = "hawk-transport"
version = "0.1.0"
edition = "2021"
authors = ["soryu-ryouji <helloryouji@outlook.com>"]
description = " hawk 原生客户端的 iroh/AccessKey Loopback 传输库"
license = "AGPL-3.0-only"

[lib]
name = "hawk_transport"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
hawk-daemon = { path = "../hawk-daemon" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
# 0.2.190 起 in6_ifreq 与路由常量仅对 macOS 暴露，iroh 的 netdev/netwatch 在 iOS 无法编译。
libc = "=0.2.189"
