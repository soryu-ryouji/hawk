# 依赖更新巡检：每周开 PR（cargo / npm），GitHub Actions 每月。
# 安全公告由 ci.yml 的 audit job 单独跑（dependabot 只管版本更新，不报存量漏洞）。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /hawk-daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /hawk-update
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /hawk-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /hawk-browser-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
