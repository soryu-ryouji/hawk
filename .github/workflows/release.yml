# CI 发版：
# - 推 v* tag：正式 Release
# - main 分支提交信息以 feat/fix 开头（conventional commits）：滚动更新 nightly 预发布（固定 tag=nightly，prerelease）
# - 手动触发：只构建上传 Artifacts，不创建 Release
# 压缩级别：CI 固定 mx=9（最小体积）；本地 npm run pack 默认 mx=5（见 scripts/pack.mjs）。
name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# nightly 滚动覆盖同一 Release，串行执行避免并发竞争
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    # tag 推送 / 手动 / main 上 feat、fix 开头的提交
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.event.head_commit.message, 'feat') ||
      startsWith(github.event.head_commit.message, 'fix')
    defaults:
      run:
        working-directory: hawk-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: hawk-app/package-lock.json

      - run: npm ci

      - name: Pack
        run: npm run pack
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: 9

      - uses: actions/upload-artifact@v4
        with:
          name: hawk-windows-portable
          path: hawk-app/dist/hawk.exe
          if-no-files-found: error

      # ---- 正式版：v* tag ----

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hawk-app/dist/hawk.exe

      # ---- nightly：main 分支 feat/fix 提交 ----

      - name: Rotate nightly release
        id: nightly
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          gh release delete nightly --yes --cleanup-tag || true
          git push origin --delete refs/tags/nightly || true

      - name: Create Nightly Release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly ${{ steps.nightly.outputs.sha }}
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          files: hawk-app/dist/hawk.exe

  # macOS app：标准 runner 已是 arm64（macos-latest），x64 由交叉打包产出，两者同机构建
  # GitHub 只能上传单文件，因此 .app 目录打 zip 发布（VS Code/Slack 同款方式）
  # needs: windows——nightly 的删除/重建由 windows job 先行完成，本 job 只补充上传，避免竞争
  macos:
    needs: windows
    runs-on: macos-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.event.head_commit.message, 'feat') ||
      startsWith(github.event.head_commit.message, 'fix')
    defaults:
      run:
        working-directory: hawk-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: hawk-app/package-lock.json

      - run: npm ci

      - name: Build web
        run: npm run build

      # 前后端都交叉编译到目标架构（electron-builder 直接下载对应 electron 产物；dotnet 同 OS 跨架构发布）
      # 输出目录：arm64 → dist/mac-arm64；x64 是 mac 默认架构 → dist/mac（无后缀）
      - name: Pack app (arm64)
        run: |
          node scripts/build-server.mjs osx-arm64
          npx electron-builder --dir --arm64
          ditto -c -k --keepParent dist/mac-arm64/hawk.app dist/hawk-mac-arm64.zip

      - name: Pack app (x64)
        run: |
          node scripts/build-server.mjs osx-x64
          npx electron-builder --dir --x64
          ditto -c -k --keepParent dist/mac/hawk.app dist/hawk-mac-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hawk-macos
          path: |
            hawk-app/dist/hawk-mac-arm64.zip
            hawk-app/dist/hawk-mac-x64.zip
          if-no-files-found: error

      # ---- 正式版：v* tag（release 由 windows job 创建，这里补充 zip 资产）----

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hawk-app/dist/hawk-mac-arm64.zip
            hawk-app/dist/hawk-mac-x64.zip

      # ---- nightly：main 分支 feat/fix 提交（nightly release/tag 已由 windows job 重建）----

      - name: Attach to Nightly Release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: |
            hawk-app/dist/hawk-mac-arm64.zip
            hawk-app/dist/hawk-mac-x64.zip
