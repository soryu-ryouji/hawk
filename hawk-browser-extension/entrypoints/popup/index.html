<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>hawk</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="head">
        <span class="brand">hawk</span>
        <span id="status" class="status"><span class="status-text">…</span></span>
      </header>

      <div id="local-fields">
        <!-- 本地模式零配置：端口由 hawk app 决定、插件自动发现，这里平时不需要填任何东西 -->
        <details id="local-advanced" class="advanced">
          <summary>高级选项</summary>
          <label>
            本地端口（留空自动发现）
            <input id="local-port" type="text" inputmode="numeric" placeholder="留空即自动查找本机 hawk" />
          </label>
          <label>
            Token（可选）
            <input id="local-token" type="text" placeholder="留空自动获取（推荐）" />
          </label>
          <p class="hint">默认按 127.0.0.1:27371–27400 自动寻找本机 hawk。只有把 hawk 的端口改到这段之外，才需要在这里填。</p>
        </details>
      </div>

      <div class="actions">
        <button id="save" type="button">保存</button>
        <button id="check" class="secondary" type="button">测试连接</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
