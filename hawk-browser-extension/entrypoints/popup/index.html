<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>hawk</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>hawk</h1>
      <p id="status" class="status">…</p>

      <label>
        连接方式
        <select id="mode">
          <option value="local">本地 hawk</option>
          <option value="remote">远程 hawk-server</option>
        </select>
      </label>

      <div id="local-fields">
        <!-- 本地模式零配置：端口由 hawk app 决定、插件自动发现，这里平时不需要填任何东西 -->
        <details id="local-advanced" class="advanced">
          <summary>高级选项</summary>
          <label>
            本地端口（留空自动发现）
            <input id="local-port" type="text" inputmode="numeric" placeholder="留空即自动查找本机 hawk" />
          </label>
          <label>
            Token（可选）
            <input id="local-token" type="text" placeholder="留空自动获取（推荐）" />
          </label>
          <p class="hint">默认按 127.0.0.1:27371–27400 自动寻找本机 hawk。只有在 hawk 设置 → 网络 → 本地服务里把端口改到这段之外时，才需要在这里填端口。</p>
        </details>
      </div>

      <div id="remote-fields" hidden>
        <label>
          hawk-server 域名
          <input id="remote-url" type="text" placeholder="https://hawk.example.com" autocomplete="off" spellcheck="false" />
        </label>
        <label>
          服务密钥（service-key）
          <input id="service-key" type="password" placeholder="hawk-server tenant add 生成的 hs_ 密钥" autocomplete="off" spellcheck="false" />
        </label>
        <label>
          访问密钥（须带写权限）
          <input id="remote-key" type="password" placeholder="hawk 设置 → 远程中签发的访问密钥" autocomplete="off" spellcheck="false" />
        </label>
        <label>
          保存到素材库
          <select id="target"></select>
        </label>
        <button id="refresh-targets" class="secondary" type="button">验证并查看素材库</button>
      </div>

      <div class="actions">
        <button id="save" type="button">保存设置</button>
        <button id="check" type="button">测试连接</button>
      </div>
      <p class="hint">右键图片，或拖拽图片到右下角投放区即可收集。</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
